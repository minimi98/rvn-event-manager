<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RVN Event Manager</title>
  <meta name="theme-color" content="#062a5f">
  <meta name="description" content="RVN Event Manager – O-Ritt 2026 Beach Please – wir reiten!">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
  (function(){
    const VERSION="10.12.8";
    const KEY="rvn_app_version";
    if(localStorage.getItem(KEY)!==VERSION){
      localStorage.setItem(KEY,VERSION);
      Promise.all([
        ("caches" in window)?caches.keys().then(keys=>Promise.all(keys.map(k=>caches.delete(k)))):Promise.resolve(),
        ("serviceWorker" in navigator)?navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))):Promise.resolve()
      ]).finally(()=>{
        if(!sessionStorage.getItem("rvn_version_reload_"+VERSION)){
          sessionStorage.setItem("rvn_version_reload_"+VERSION,"1");
          const u=new URL(location.href);
          u.searchParams.set("v",VERSION);
          location.replace(u.toString());
        }
      });
    }
  })();
  </script>
  <link rel="stylesheet" href="css/style.css?v=10.12.8">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="js/app.js?v=10.12.8"></script>
</body>
</html>
